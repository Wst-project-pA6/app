      value: { partId: 7c0d2f60-5a1b-4f0e-8d3c-2b9e4a1f6c77, storeId: 1a9b8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d, quantity: 2 }
    InsufficientStockExample:
      summary: Concurrent issue exhausted stock
      value: { code: INSUFFICIENT_STOCK, message: "Requested quantity exceeds available stock.", details: [ { field: /quantity, code: INSUFFICIENT_STOCK, message: "Only 1 unit available.", params: { available: '1', requested: '2' } } ], requestId: 01J9ZK3Q8W2V5X7Y1B4N6M8P0R }
    PurchaseApprovalExample:
      summary: Approve a purchase order
