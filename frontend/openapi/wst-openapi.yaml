      operationId: assignJobCard
      summary: Assign bay, technician and time window
      description: "Requires `jobs.assign`. Validates the shared bay calendar server-side: bay availability, overlap with other active jobs and with published training sessions, and technician double-booking as a mentor. Conflicts return 409 SCHEDULE_CONFLICT with an explainable conflict list; job assignments have no override. Not allowed for DELIVERED jobs."
