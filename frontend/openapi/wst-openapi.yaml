      value: { code: SCHEDULE_CONFLICT, message: "The session cannot be published because bay B2 is occupied.", requestId: 01J9ZK5D3F7G9H2J4K6M8N0P1Q, conflicts: [ { conflictKey: BAY_JOB_CONFLICT-b2-jc-2026-000123, kind: BAY_JOB_CONFLICT, overridable: true, overridden: false, message: "Bay B2 is occupied by job JC-2026-000123 from 09:00 to 13:00.", bayId: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a, conflictingReference: { kind: JOB, referenceId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, referenceLabel: JC-2026-000123, startsAt: '2026-10-05T09:00:00Z', endsAt: '2026-10-05T13:00:00Z' } } ] }
    CertificateVerificationExample:
      summary: Valid certificate
      value: { certificateNumber: CERT-2026-000017, status: ISSUED, holderDisplayName: "Sara M.", courseName: { en: "Brake Systems Fundamentals", ar: "أساسيات أنظمة الفرامل" }, issuedAt: '2026-09-30T10:00:00Z' }
  schemas:
    Uuid: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time, description: "RFC 3339 UTC timestamp." }
    DateOnly: { type: string, format: date }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$', description: "ISO-4217 alphabetic currency code." }
    MoneyAmount: { type: string, pattern: '^-?[0-9]{1,12}(\.[0-9]{1,4})?$', description: "Decimal string; never a JSON number." }
    Money:
      type: object
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/MoneyAmount' }, currency: { $ref: '#/components/schemas/CurrencyCode' } }
    DecimalString: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$' }
    Locale: { type: string, enum: [en, ar] }
    LocalizedName:
      type: object
      required: [en]
      properties: { en: { type: string, minLength: 1, maxLength: 200 }, ar: { type: string, minLength: 1, maxLength: 200 } }
    RecordMeta:
      type: object
      required: [id, createdAt, updatedAt, createdBy, updatedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid', readOnly: true }
        createdAt: { $ref: '#/components/schemas/Timestamp', readOnly: true }
        updatedAt: { $ref: '#/components/schemas/Timestamp', readOnly: true }
        createdBy: { $ref: '#/components/schemas/Uuid', readOnly: true }
        updatedBy: { $ref: '#/components/schemas/Uuid', readOnly: true }
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties: { page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1, maximum: 100 }, totalItems: { type: integer, minimum: 0 }, totalPages: { type: integer, minimum: 0 } }
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
    UserRef:
      type: object
      required: [id, displayName]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, displayName: { type: string } }
    DownloadAuthorization:
      type: object
      required: [url, expiresAt]
      properties: { url: { type: string, format: uri, description: "Signed, single-purpose URL bound to the caller; never permanent." }, expiresAt: { $ref: '#/components/schemas/Timestamp' } }
    ErrorCode:
      type: string
      enum: [BAD_REQUEST, UNAUTHENTICATED, INVALID_CREDENTIALS, TOKEN_EXPIRED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE, INVALID_STATE_TRANSITION, VERSION_CONFLICT, DUPLICATE_RESOURCE, IDEMPOTENCY_CONFLICT, RESOURCE_IN_USE, CUSTOMER_APPROVAL_REQUIRED, JOB_STAGE_NOT_ALLOWED, JOB_ASSIGNMENT_REQUIRED, CHECKLIST_INCOMPLETE, QUALITY_CHECK_REQUIRED, INVOICE_REQUIRED, INSUFFICIENT_STOCK, REVERSAL_EXCEEDS_ISSUED, RESERVATION_INVALID, SCHEDULE_CONFLICT, CONFLICT_NOT_OVERRIDABLE, SEPARATION_OF_DUTIES_VIOLATION, DUPLICATE_APPROVAL, RECEIPT_EXCEEDS_ORDERED, PAYMENT_AMOUNT_MISMATCH, ASSESSMENT_LOCKED, CERTIFICATE_NOT_ELIGIBLE, ATTACHMENT_INVALID, ATTACHMENT_NOT_LINKABLE, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, EXPORT_NOT_READY, EXPORT_EXPIRED]
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        field: { type: string, description: "JSON Pointer to the offending request field." }
        code: { type: string, description: "Machine-readable detail code, for example REQUIRED, TOO_LONG, MILEAGE_LOWER_THAN_RECORDED." }
        message: { type: string }
        params: { type: object, additionalProperties: { type: string }, description: "Named values for message templates, for example available and requested quantities." }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: "Human-readable message in the negotiated language." }
        details: { type: array, items: { $ref: '#/components/schemas/ErrorDetail' } }
        requestId: { type: string, description: "Correlation id also present in logs and audit events." }
    ScheduleConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [conflicts]
          properties: { conflicts: { type: array, items: { $ref: '#/components/schemas/ScheduleConflict' } } }
    HealthStatus:
      type: object
      required: [status, time]
      properties: { status: { type: string, enum: [UP] }, version: { type: string }, time: { $ref: '#/components/schemas/Timestamp' } }
    ReadinessStatus:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [UP, DEGRADED, DOWN] }
        components:
          type: array
          items:
            type: object
            required: [name, status, critical]
            properties: { name: { type: string, enum: [DATABASE, OBJECT_STORAGE, AI_SERVICE] }, status: { type: string, enum: [UP, DOWN, NOT_ENABLED] }, critical: { type: boolean } }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties: { email: { type: string, format: email, maxLength: 254 }, password: { type: string, minLength: 1, maxLength: 128, writeOnly: true } }
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties: { refreshToken: { type: string, minLength: 20, maxLength: 512, writeOnly: true } }
    LogoutRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties: { refreshToken: { type: string, minLength: 20, maxLength: 512, writeOnly: true } }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties: { currentPassword: { type: string, maxLength: 128, writeOnly: true }, newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true } }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, mustChangePassword]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, tokenType: { type: string, enum: [Bearer] }, expiresIn: { type: integer, minimum: 1, description: "Access token lifetime in seconds." }, mustChangePassword: { type: boolean } }
    CurrentUser:
      type: object
      required: [id, email, displayName, preferredLocale, roles, permissions, organizationScopeIds, mustChangePassword]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        displayName: { type: string }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, uniqueItems: true }
        organizationScopeIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        studentId: { $ref: '#/components/schemas/Uuid' }
        mustChangePassword: { type: boolean }
    RoleCode:
      type: string
      enum: [SYSTEM_ADMIN, WORKSHOP_MANAGER, SERVICE_ADVISOR, TECHNICIAN, QUALITY_CHECKER, STOREKEEPER_PROCUREMENT, MENTOR, TRAINING_SUPERVISOR, STUDENT, FINANCE_VIEWER_AUDITOR]
    Permission:
      type: string
      enum: [users.read, users.manage, roles.assign, scopes.manage, config.read, config.manage, audit.read, customers.read, customers.write, vehicles.read, vehicles.write, jobs.read, jobs.read.assigned, jobs.create, jobs.update, jobs.assign, jobs.transition.start, jobs.transition.submit-qc, jobs.transition.ready, jobs.transition.deliver, quality.perform, approvals.read, approvals.record, labor.read, labor.write, bays.read, bays.manage, parts.read, parts.write, stores.manage, inventory.read, inventory.cost.read, inventory.issue, inventory.reverse, inventory.adjust, inventory.adjust.approve, vendors.read, vendors.write, purchasing.read, purchasing.create, purchasing.approve, purchasing.receive, invoices.read, invoices.manage, payments.record, training.read, training.manage, training.publish, training.override-conflict, training.attendance.record, training.assess, training.signoff, certificates.issue, certificates.revoke, attachments.upload, dashboards.workshop, dashboards.inventory-finance, dashboards.training, dashboards.ai-data, exports.create, exports.read, predictions.reorder.read, predictions.reorder.decide, predictions.risk.read, predictions.risk.decide, students.self]
    Role:
      type: object
      required: [code, description, permissions]
      properties: { code: { $ref: '#/components/schemas/RoleCode' }, description: { type: string }, permissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, uniqueItems: true } }
    RoleList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    OrganizationScope:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required: [code, name, type, status]
          properties:
            code: { type: string, minLength: 2, maxLength: 40 }
            name: { type: string, minLength: 1, maxLength: 120 }
            type: { type: string, enum: [BRANCH, STORE, TRAINING_PROGRAM] }
            parentId: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
    OrganizationScopeCreateRequest:
      type: object
      required: [code, name, type]
      additionalProperties: false
      properties: { code: { type: string, minLength: 2, maxLength: 40 }, name: { type: string, minLength: 1, maxLength: 120 }, type: { type: string, enum: [BRANCH, STORE, TRAINING_PROGRAM] }, parentId: { $ref: '#/components/schemas/Uuid' } }
    OrganizationScopeUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties: { name: { type: string, minLength: 1, maxLength: 120 }, status: { type: string, enum: [ACTIVE, INACTIVE] } }
    User:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required: [email, displayName, preferredLocale, status, roles, organizationScopeIds, mustChangePassword]
          properties:
            email: { type: string, format: email, maxLength: 254 }
            displayName: { type: string, minLength: 1, maxLength: 120 }
            preferredLocale: { $ref: '#/components/schemas/Locale' }
            status: { type: string, enum: [ACTIVE, DISABLED] }
            roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' }, uniqueItems: true }
            organizationScopeIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, uniqueItems: true }
            studentId: { $ref: '#/components/schemas/Uuid' }
            mustChangePassword: { type: boolean }
            lastLoginAt: { $ref: '#/components/schemas/Timestamp' }
    UserCreateRequest:
      type: object
      required: [email, displayName, preferredLocale, temporaryPassword]
      additionalProperties: false
      properties: { email: { type: string, format: email, maxLength: 254 }, displayName: { type: string, minLength: 1, maxLength: 120 }, preferredLocale: { $ref: '#/components/schemas/Locale' }, temporaryPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true } }
    UserUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties: { displayName: { type: string, minLength: 1, maxLength: 120 }, preferredLocale: { $ref: '#/components/schemas/Locale' }, status: { type: string, enum: [ACTIVE, DISABLED] }, temporaryPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true } }
    RoleAssignmentRequest:
      type: object
