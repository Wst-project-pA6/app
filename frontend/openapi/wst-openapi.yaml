openapi: 3.1.0
info:
  title: Workshop Management & Student Practical Training (WST) API
  version: 1.0.0
  summary: Contract-first REST API for the WST academic MVP.
  description: |
    Source of truth for the PostgreSQL schema, Node.js backend, automated tests, React client and documentation.
    Requirement prefix: WST. Every operation carries `x-requirement-id` and `x-priority`.

    ## Conventions
    - Base path `/api/v1`. JSON bodies (multipart only for attachment upload). Bearer JWT. Operations with `security: []` are public.
    - Identifiers are UUIDs. Human-readable numbers (`jobNumber`, `poNumber`, `invoiceNumber`, `certificateNumber`) are server-generated, unique, immutable, and never localized or reordered by the backend.
    - Timestamps are RFC 3339 UTC. Dates are `YYYY-MM-DD`.
    - Money is `{amount, currency}`: `amount` is a decimal string (never a float) and `currency` an ISO-4217 code. One system currency is configured in finance settings; documents in another currency are rejected with 422. Part quantities are whole numbers. Rates and metric values are decimal strings.
    - Optional properties without a value are omitted, never null. `readOnly` properties are server-controlled. Request schemas forbid unknown properties, so clients cannot submit ids, audit fields, stock balances, invoice totals, or permissions.
    - Mutable business resources expose `id`, `createdAt`, `updatedAt`, `createdBy`, `updatedBy` (and `status` where a lifecycle exists). History-sensitive facts (stage events, stock movements, approvals, quality checks, sign-offs, audit events) are immutable append-only records.

    ## Collections
    `page` (default 1), `pageSize` (default 20, maximum 100), `sort` (prefix `-` for descending) and typed filters. Unknown filters or sort fields return 400. Responses are `{items, page}`. `GET /roles` is the only unpaged collection (fixed set of ten roles).

    ## Authorization
    Enforced on the backend from the JWT identity, never from client claims or UI visibility. `x-permissions` lists permissions of which the caller needs ANY ONE; `x-role-permissions` (root) is the default role-to-permission matrix; users may hold several roles (union of permissions). After the permission check, row scope applies: organization scope, technicians see only their assigned jobs, mentors only their own sessions, students only their own records (`students.self`). Missing permission returns 403. A row outside the caller's scope returns 404 so existence is not disclosed.

    ## Concurrency and idempotency
    Resources with a `version` property require it on update; a stale value returns 409 `VERSION_CONFLICT`. Stage and status transitions are controlled action resources and never a PATCH of `stage` or `status`. Stock-changing and payment POSTs accept `Idempotency-Key`: replay with the same key and body returns the original result; same key with a different body returns 409 `IDEMPOTENCY_CONFLICT`.

    ## Localization
    `Accept-Language: en|ar` (accepted on every operation) selects the language of `message`, explanations and localized labels. Enum codes, identifiers (UUIDs, job numbers, VINs, plates, SKUs, barcodes) and amounts are never translated or directionally transformed. RTL layout is a client concern.

    ## Errors and rate limiting
    All errors use the `Error` schema. 409 covers invalid state transitions, scheduling conflicts, concurrency conflicts and duplicate or conflicting business operations; 422 covers semantic validation. Any operation may return 429 (`Retry-After`), 500 or 503; internals are never leaked. Passwords, tokens and secrets are never returned or logged.

    ## Audit
    Every important mutation writes an immutable `AuditEvent` (actor, timestamp, action, entity, outcome). Significant sensitive reads (attachment and export download authorizations, audit reads) are audited too.

    ## Non-API concerns (implementation responsibility)
    Password hashing (Argon2id or bcrypt), HTTPS termination, dependency scanning, container restart policy, documented database restore procedure, seed script (dev tooling, no seed endpoint), private object storage, antivirus and content sniffing of uploads. Attachment limits: 10 MiB per file; JPEG, PNG, WebP or PDF only. Notifications, automated reminders, QR rendering, multi-store transfers, advanced stock counts, RFQ comparison, partial payments, trained ML models and mobile/PWA are Stretch and intentionally absent.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (Docker Compose)
  - url: https://{host}/api/v1
    description: Deployed environments (HTTPS mandatory)
    variables:
      host: { default: wst.example.edu, description: "Deployment hostname" }
security:
  - bearerAuth: []
x-permission-semantics: "x-permissions on an operation is an any-of list. An empty list means the operation is public or needs authentication only."
x-role-permissions:
  SYSTEM_ADMIN: [users.read, users.manage, roles.assign, scopes.manage, config.read, config.manage, audit.read]
  WORKSHOP_MANAGER: [customers.read, vehicles.read, jobs.read, jobs.update, jobs.assign, jobs.transition.start, jobs.transition.submit-qc, jobs.transition.ready, jobs.transition.deliver, approvals.read, labor.read, bays.read, bays.manage, parts.read, inventory.read, inventory.cost.read, inventory.reverse, inventory.adjust.approve, vendors.read, purchasing.read, purchasing.approve, invoices.read, invoices.manage, config.read, training.read, training.override-conflict, attachments.upload, dashboards.workshop, dashboards.inventory-finance, dashboards.ai-data, exports.create, exports.read, predictions.reorder.read]
  SERVICE_ADVISOR: [customers.read, customers.write, vehicles.read, vehicles.write, jobs.read, jobs.create, jobs.update, jobs.transition.deliver, approvals.read, approvals.record, invoices.read, invoices.manage, payments.record, bays.read, attachments.upload, config.read]
  TECHNICIAN: [jobs.read.assigned, jobs.transition.start, jobs.transition.submit-qc, approvals.read, labor.read, labor.write, parts.read, inventory.read, inventory.issue, attachments.upload, bays.read]
  QUALITY_CHECKER: [jobs.read, quality.perform, jobs.transition.ready, approvals.read, labor.read, parts.read, inventory.read, attachments.upload, bays.read]
  STOREKEEPER_PROCUREMENT: [parts.read, parts.write, stores.manage, inventory.read, inventory.cost.read, inventory.reverse, inventory.adjust, vendors.read, vendors.write, purchasing.read, purchasing.create, purchasing.receive, attachments.upload, dashboards.inventory-finance, dashboards.ai-data, exports.create, exports.read, predictions.reorder.read, predictions.reorder.decide]
  MENTOR: [training.read, training.attendance.record, training.assess, attachments.upload, bays.read, predictions.risk.read]
  TRAINING_SUPERVISOR: [training.read, training.manage, training.publish, training.attendance.record, training.signoff, certificates.issue, certificates.revoke, bays.read, attachments.upload, dashboards.training, dashboards.ai-data, exports.create, exports.read, predictions.risk.read, predictions.risk.decide]
  STUDENT: [students.self]
  FINANCE_VIEWER_AUDITOR: [invoices.read, purchasing.read, inventory.read, inventory.cost.read, audit.read, dashboards.workshop, dashboards.inventory-finance, exports.create, exports.read]
tags:
  - { name: Authentication, description: "Login, token refresh, current identity." }
  - { name: Users & Access, description: "Users, roles, permissions and organization scopes." }
  - { name: Configuration, description: "Approval thresholds, finance settings and prediction settings." }
  - { name: Customers, description: "Customers and customer statements." }
  - { name: Vehicles, description: "Vehicles, service history and service reminders." }
  - { name: Bays, description: "Shared bay resources and the shared bay calendar (jobs and training)." }
  - { name: Workshop Jobs, description: "Job cards, lifecycle, stage history, work items, quality checks." }
  - { name: Job Approvals, description: "Customer approvals that gate billable work." }
  - { name: Labor, description: "Labor logging." }
  - { name: Attachments, description: "Private evidence and photos with short-lived download authorizations." }
  - { name: Inventory, description: "Stores, parts, balances, ledger, reservations, part issues, adjustments." }
  - { name: Procurement, description: "Vendors, purchase orders, approvals, goods receipts." }
  - { name: Invoices, description: "Accounting-lite invoices, sublet costs, payment references, statements." }
  - { name: Training, description: "Terms, courses, tasks, sessions, groups, enrollments, students, mentors." }
  - { name: Attendance, description: "Session attendance." }
  - { name: Assessments, description: "Practical task library, assessments and supervisor sign-off." }
  - { name: Competencies, description: "Competencies, coverage and completion eligibility." }
  - { name: Certificates, description: "Certificate issuance, revocation and public verification." }
  - { name: Dashboards, description: "Role-scoped metrics." }
  - { name: Exports, description: "Asynchronous filtered CSV/PDF exports." }
  - { name: Predictions, description: "Advisory rule-based suggestions and risk flags." }
  - { name: Audit, description: "Immutable audit events." }
  - { name: System Health, description: "Liveness and readiness." }
paths:
  /health:
    get:
      tags: [System Health]
      operationId: getHealth
      summary: Liveness probe
      description: "Public. Returns 200 while the process runs; no dependency checks. Used by container restart policy."
      security: []
      x-nfr: [availability]
      responses:
        '200': { description: Alive, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/ready:
    get:
      tags: [System Health]
      operationId: getReadiness
      summary: Readiness probe
      description: "Public. Checks the database and object storage (critical) and the optional AI service (non-critical). An offline AI service yields DEGRADED with HTTP 200 and never blocks workshop or training operations. A critical failure returns 503."
      security: []
      x-nfr: [availability]
      x-requirement-id: [WST-FR-14]
      x-priority: Should
      responses:
        '200': { description: Ready or degraded, content: { application/json: { schema: { $ref: '#/components/schemas/ReadinessStatus' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with email and password
      description: "Public and rate limited per IP and per account (429). Unknown user and wrong password return the same 401 INVALID_CREDENTIALS. Returns a short-lived access token and a rotating refresh token."
      security: []
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate the refresh token
      description: "Public and rate limited. The presented refresh token is single-use; reuse of a rotated token revokes the whole token family."
      security: []
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses:
        '200': { description: New token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh token
      description: "Any authenticated user. Revokes the given refresh token family."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogoutRequest' } } } }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Current identity, roles, effective permissions and scopes
      description: "Any authenticated user. Used by the client to decide what to render; rendering is never authorization."
      x-requirement-id: [WST-FR-01, WST-FR-02]
      x-priority: Must
      x-permissions: []
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change own password
      description: "Any authenticated user. Verifies the current password, enforces the password policy, revokes other refresh tokens and clears mustChangePassword."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /users:
    get:
      tags: [Users & Access]
      operationId: listUsers
      summary: List users
      description: "Requires `users.read`. Sortable: displayName, email, createdAt (default -createdAt)."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [users.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
        - { name: role, in: query, schema: { $ref: '#/components/schemas/RoleCode' } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { name: organizationScopeId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users & Access]
      operationId: createUser
      summary: Create a user
      description: "Requires `users.manage`. The user starts with no roles and no scopes; roles and scopes are granted through their own operations (distinct permissions). The temporary password is write-only, hashed, never logged, and forces mustChangePassword."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [users.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users & Access]
      operationId: getUser
      summary: Get a user
      description: "Requires `users.read`."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [users.read]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users & Access]
      operationId: updateUser
      summary: Update profile, locale, status or reset the password
      description: "Requires `users.manage`. Disabling a user revokes all of their refresh tokens. A supplied temporaryPassword resets the password and forces a change at next login. An administrator cannot disable their own account (409 SEPARATION_OF_DUTIES_VIOLATION)."
      x-requirement-id: [WST-FR-01, WST-FR-02]
      x-priority: Must
      x-permissions: [users.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdateRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users & Access]
      operationId: replaceUserRoles
      summary: Replace the role set of a user
      description: "Requires `roles.assign`. Administrators cannot change their own roles, and the last active SYSTEM_ADMIN cannot be removed (409 SEPARATION_OF_DUTIES_VIOLATION). Audited as a permission change."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [roles.assign]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignmentRequest' } } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}/organization-scopes:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users & Access]
      operationId: replaceUserOrganizationScopes
      summary: Replace the organization scopes of a user
      description: "Requires `scopes.manage`. Row-level access derives from these scopes. Audited as a permission change."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [scopes.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScopeAssignmentRequest' } } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /roles:
    get:
      tags: [Users & Access]
      operationId: listRoles
      summary: List roles and their permissions
      description: "Requires `users.read`. Fixed set of ten roles; unpaged."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [users.read]
      responses:
        '200': { description: Roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organization-scopes:
    get:
      tags: [Users & Access]
      operationId: listOrganizationScopes
      summary: List organization scopes
      description: "Requires `scopes.manage` or `users.read`. Sortable: name, code, createdAt."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [scopes.manage, users.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - { name: type, in: query, schema: { type: string, enum: [BRANCH, STORE, TRAINING_PROGRAM] } }
      responses:
        '200': { description: Scopes, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationScopePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users & Access]
      operationId: createOrganizationScope
      summary: Create an organization scope
      description: "Requires `scopes.manage`."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [scopes.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationScopeCreateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationScope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organization-scopes/{scopeId}:
    parameters:
      - $ref: '#/components/parameters/ScopeId'
    patch:
      tags: [Users & Access]
      operationId: updateOrganizationScope
      summary: Update an organization scope
      description: "Requires `scopes.manage`."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [scopes.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationScopeUpdateRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationScope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /config/purchase-approval-policy:
    get:
      tags: [Configuration]
      operationId: getPurchaseApprovalPolicy
      summary: Get purchase approval thresholds
      description: "Requires `config.read` or `purchasing.read`. Thresholds are configuration; the API defines no monetary value."
      x-requirement-id: [WST-FR-08]
      x-priority: Must
      x-permissions: [config.read, purchasing.read]
      responses:
        '200': { description: Policy, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseApprovalPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Configuration]
      operationId: replacePurchaseApprovalPolicy
      summary: Replace purchase approval thresholds
      description: "Requires `config.manage`. Tiers must be strictly ascending by minimumTotal and the first tier must start at 0. A purchase order snapshots its required approvals when submitted, so later policy changes do not affect orders already pending. Audited."
      x-requirement-id: [WST-FR-08]
      x-priority: Must
      x-permissions: [config.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseApprovalPolicyUpdateRequest' } } } }
      responses:
        '200': { description: Updated policy, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseApprovalPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /config/finance-settings:
    get:
      tags: [Configuration]
      operationId: getFinanceSettings
      summary: Get currency, labor rate and tax configuration
      description: "Requires `config.read` or `invoices.read`."
      x-requirement-id: [WST-FR-09]
      x-priority: Should
      x-permissions: [config.read, invoices.read]
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Configuration]
      operationId: replaceFinanceSettings
      summary: Replace finance settings
      description: "Requires `config.manage`. Changing the currency after any invoice or purchase order exists returns 409 RESOURCE_IN_USE. Rate changes apply to future labor entries only because each entry snapshots its rate. Audited."
      x-requirement-id: [WST-FR-09]
      x-priority: Should
      x-permissions: [config.manage]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSettingsUpdateRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /config/prediction-settings:
    get:
      tags: [Configuration]
      operationId: getPredictionSettings
      summary: Get rule-baseline and ML toggle settings
      description: "Requires `config.read`."
      x-requirement-id: [WST-FR-14]
      x-priority: Should
      x-permissions: [config.read]
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/PredictionSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Configuration]
      operationId: replacePredictionSettings
      summary: Replace prediction settings
