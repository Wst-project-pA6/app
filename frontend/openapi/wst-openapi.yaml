      x-permissions: [jobs.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCardCreateRequest' }
            examples:
              basic: { $ref: '#/components/examples/JobCardCreateExample' }
