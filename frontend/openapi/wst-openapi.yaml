      x-permissions: [predictions.reorder.decide, predictions.risk.decide]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PredictionRunRequest' } } } }
      responses:
        '201': { description: Run completed, content: { application/json: { schema: { $ref: '#/components/schemas/PredictionRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Search immutable audit events
      description: "Requires `audit.read` (SYSTEM_ADMIN and FINANCE_VIEWER_AUDITOR). Read-only. Filter by entityType and entityId to obtain the complete history of any record. Sensitive values are redacted in changes. Reading audit events is itself audited. Sortable: occurredAt (default -occurredAt)."
      x-requirement-id: [WST-FR-01, WST-FR-05, WST-FR-06]
      x-priority: Must
      x-permissions: [audit.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: actorUserId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: entityType, in: query, schema: { type: string, maxLength: 60 } }
        - { name: entityId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: outcome, in: query, schema: { type: string, enum: [SUCCESS, DENIED, FAILED] } }
      responses:
        '200': { description: Audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-events/{auditEventId}:
    parameters:
      - $ref: '#/components/parameters/AuditEventId'
    get:
      tags: [Audit]
      operationId: getAuditEvent
      summary: Get an audit event
      description: "Requires `audit.read`."
      x-requirement-id: [WST-FR-01]
      x-priority: Must
      x-permissions: [audit.read]
      responses:
        '200': { description: Audit event, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEvent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Short-lived access token issued by login or refresh. The token identifies the user only; roles, permissions and scopes are resolved server-side on each request."
  parameters:
    Page: { name: page, in: query, description: "1-based page number.", schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, description: "Items per page, maximum 100.", schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort: { name: sort, in: query, description: "Comma-separated fields; prefix - for descending. Only fields named by the operation are accepted.", schema: { type: string, maxLength: 100, pattern: '^-?[A-Za-z][A-Za-z0-9]*(,-?[A-Za-z][A-Za-z0-9]*)*$' } }
    From: { name: from, in: query, description: "Inclusive lower bound (RFC 3339 UTC).", schema: { $ref: '#/components/schemas/Timestamp' } }
    To: { name: to, in: query, description: "Exclusive upper bound (RFC 3339 UTC).", schema: { $ref: '#/components/schemas/Timestamp' } }
    Query: { name: q, in: query, description: "Case-insensitive text search.", schema: { type: string, minLength: 1, maxLength: 100 } }
    AcceptLanguage: { name: Accept-Language, in: header, description: "en or ar. Selects the language of messages and labels; unsupported values fall back to en. Never alters identifiers or amounts.", schema: { $ref: '#/components/schemas/Locale' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, description: "Client-generated key that makes the POST safely repeatable.", schema: { type: string, minLength: 8, maxLength: 128 } }
    ReportFilterQuery: { name: filters, in: query, description: "Report filters, sent as individual query parameters (from, to, organizationScopeId, storeId, bayId, technicianId, courseId, termId). Identical to the filters of ExportJobCreateRequest.", style: form, explode: true, schema: { $ref: '#/components/schemas/ReportFilters' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ScopeId: { name: scopeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CustomerId: { name: customerId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    VehicleId: { name: vehicleId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReminderId: { name: reminderId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BayId: { name: bayId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    JobId: { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    WorkItemId: { name: workItemId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ApprovalId: { name: approvalId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    LaborEntryId: { name: laborEntryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PartIssueId: { name: partIssueId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReservationId: { name: reservationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SubletEntryId: { name: subletEntryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    StoreId: { name: storeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PartId: { name: partId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AdjustmentId: { name: adjustmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    VendorId: { name: vendorId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PurchaseOrderId: { name: purchaseOrderId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    InvoiceId: { name: invoiceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TermId: { name: termId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CourseId: { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CompetencyId: { name: competencyId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TaskId: { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    StudentId: { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupId: { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    EnrollmentId: { name: enrollmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AssessmentId: { name: assessmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CertificateId: { name: certificateId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    VerificationToken: { name: verificationToken, in: path, required: true, schema: { type: string, minLength: 43, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$' } }
    ExportJobId: { name: exportJobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PredictionId: { name: predictionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AuditEventId: { name: auditEventId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  responses:
    BadRequest:
      description: "Malformed request, unknown filter or sort field, or invalid query parameter."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: "Missing, invalid or expired credentials."
      headers: { WWW-Authenticate: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: "Authenticated but lacking the required permission. Rows outside the caller's scope are reported as 404 instead."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: "Resource does not exist or is outside the caller's row scope."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: "Invalid state transition, missing customer approval, insufficient stock, concurrency conflict, separation-of-duties violation or duplicate business operation. See Error.code."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ScheduleConflict:
      description: "Shared bay or mentor scheduling conflict, or another conflict per Error.code. Scheduling conflicts include an explainable list."
      content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleConflictError' }, examples: { conflict: { $ref: '#/components/examples/ScheduleConflictExample' } } } }
    ValidationError:
      description: "Semantic validation failed; details identify each offending field."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: "Uploaded file exceeds the size limit."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: "File type not allowed or content does not match the declared type."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: "Rate limit exceeded."
      headers: { Retry-After: { description: "Seconds to wait before retrying.", schema: { type: integer, minimum: 1 } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: "Unexpected server error. No internals are disclosed; quote requestId to support."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: "A critical dependency (database or object storage) is unavailable."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  examples:
    JobCardCreateExample:
      summary: Open a periodic-service job
      value: { vehicleId: 3f2a6d1e-8b7c-4c1d-9a55-0d6f1a2b3c4d, complaint: "Engine warning light and noise when braking", serviceType: REPAIR, priority: NORMAL, mileageAtIntake: 84210, expectedCompletionAt: '2026-10-02T15:00:00Z', workItems: [ { description: "Diagnose warning light" }, { description: "Inspect brake pads" } ] }
    JobTransitionExample:
