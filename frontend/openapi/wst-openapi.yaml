    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Workshop Jobs]
      operationId: transitionJobCard
      summary: Move a job to the next lifecycle stage
      description: |
        Controlled transition; there is no PATCH of stage. Allowed transitions only: RECEIVED to IN_PROGRESS, IN_PROGRESS to QUALITY_CHECK, QUALITY_CHECK to IN_PROGRESS (rework), QUALITY_CHECK to READY, READY to DELIVERED. Anything else returns 409 INVALID_STATE_TRANSITION. If the current stage differs from expectedFromStage the result is 409 VERSION_CONFLICT.
        Permission by target: IN_PROGRESS from RECEIVED needs `jobs.transition.start`; QUALITY_CHECK needs `jobs.transition.submit-qc`; IN_PROGRESS from QUALITY_CHECK needs `quality.perform`; READY needs `jobs.transition.ready`; DELIVERED needs `jobs.transition.deliver`. Technicians act only on assigned jobs.
        Guards: start requires bay and technician (JOB_ASSIGNMENT_REQUIRED) and an APPROVED INITIAL_WORK approval (CUSTOMER_APPROVAL_REQUIRED). Submitting to quality check requires every non-cancelled work item to be DONE (CHECKLIST_INCOMPLETE). Rework requires the latest quality check to be FAILED and a reason. READY requires the latest quality check to be PASSED (QUALITY_CHECK_REQUIRED) and atomically generates the DRAFT invoice from logged labor and issued parts. DELIVERED requires a non-void invoice (INVOICE_REQUIRED).
