    get:
      tags: [Workshop Jobs]
      operationId: getJobCard
      summary: Get a job card
      description: "Requires `jobs.read` or `jobs.read.assigned` (assigned jobs only)."
      x-requirement-id: [WST-FR-04]
      x-priority: Must
      x-permissions: [jobs.read, jobs.read.assigned]
